<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - EduLink</title>
    
    <!-- Import Font Klasik & Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        serif: ['"Merriweather"', 'serif'],
                    },
                    colors: {
                        eduCrimson: {
                            600: '#A51C30',
                            700: '#8A1525',
                        },
                        eduDark: {
                            900: '#141414',
                            800: '#1A1A1A',
                        },
                        eduPaper: '#F7F7F7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-eduPaper text-gray-800 font-sans min-h-screen flex selection:bg-eduCrimson-600 selection:text-white overflow-hidden">

    <!-- Sisi Kiri: Branding & Logo Resmi EduLink -->
    <div class="hidden lg:flex lg:w-1/2 bg-eduPaper items-center justify-center p-12 relative z-0">
        <div class="max-w-md w-full flex flex-col items-center justify-center text-center">
            <img src="{{ url_for('static', filename='images/edulink-logo.jpg') }}" 
                 alt="EduLink Logo Resmi" 
                 class="w-full max-w-[380px] h-auto object-contain mix-blend-multiply drop-shadow-xl transition duration-500">
        </div>
    </div>

    <!-- Sisi Kanan: Panel Form Login Bersih -->
    <div class="w-full lg:w-1/2 bg-white min-h-screen flex flex-col justify-center px-10 sm:px-20 xl:px-32 relative shadow-2xl z-10 overflow-y-auto">
        
        <!-- Tombol Kembali -->
        <a href="/" class="absolute top-10 left-10 sm:left-20 xl:left-32 text-xs font-bold uppercase tracking-[0.2em] text-gray-400 hover:text-eduCrimson-600 transition duration-300 flex items-center gap-3">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </a>
        
        <div class="mt-20 mb-8">
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-eduDark-900 mb-5 tracking-tight">
                Portal Login.
            </h1>
            <div class="border-l-[3px] border-eduCrimson-600 pl-5">
                <p class="text-gray-500 font-serif italic text-sm md:text-base leading-relaxed">
                    Suite terpadu untuk Disiplin, Prestasi, Absensi, dan CBT – administrasi jauh lebih ringan.
                </p>
            </div>
        </div>

        <!-- Alert Error jika Login Gagal -->
        {% if error %}
        <div class="mb-6 p-4 bg-red-50 border-l-4 border-eduCrimson-600 text-eduCrimson-700 text-xs font-bold uppercase tracking-wider flex items-center gap-3">
            <i class="fa-solid fa-circle-exclamation text-base"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <!-- Form Area -->
        <form action="/login" method="POST" class="flex flex-col gap-6">
            
            <!-- Input: Pilih Peran -->
            <div class="flex flex-col gap-2">
                <label class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">Login Sebagai *</label>
                <div class="relative">
                    <i class="fa-solid fa-user-tie absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <select name="role" required class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-4 pl-14 pr-10 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 appearance-none cursor-pointer rounded-none">
                        <option value="">-- Pilih Peran Anda --</option>
                        <option value="admin">Administrator</option>
                        <option value="guru">Guru / Staff</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-5 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                </div>
            </div>
            
            <!-- Input: Username -->
            <div class="flex flex-col gap-2">
                <label class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">NIP / NISN / Username</label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" name="username" required placeholder="Masukkan ID Anda" autocomplete="off" class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-4 pl-14 pr-5 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 rounded-none">
                </div>
            </div>
            
            <!-- Input: Password -->
            <div class="flex flex-col gap-2">
                <label class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="password" name="password" required placeholder="Masukkan Password Anda" class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-4 pl-14 pr-5 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 rounded-none">
                </div>
            </div>
            
            <!-- Tombol Login -->
            <button type="submit" class="mt-4 bg-eduDark-900 hover:bg-eduCrimson-600 text-white font-bold py-4 transition duration-300 flex items-center justify-center gap-3 text-[12px] uppercase tracking-widest shadow-xl shadow-eduDark-900/10 w-full group">
                Masuk ke EduLink <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition duration-300"></i>
            </button>
            
            <p class="text-center text-xs text-gray-400 mt-2 italic font-serif">
                Tekan Enter untuk masuk. Pastikan memilih peran yang tepat.
            </p>
        </form>
        
        <div class="mt-auto pt-16 pb-8">
            <div class="flex items-center justify-between border-t border-gray-100 pt-6">
                <span class="text-[11px] text-gray-400 uppercase tracking-widest">&copy; 2026 EduLink Platform.</span>
                <a href="#" class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] hover:text-eduCrimson-600 transition duration-300">
                    Tentang Aplikasi
                </a>
            </div>
        </div>
        
    </div>

</body>
</html>
