<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal - EduLink</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        serif: ['"Merriweather"', 'serif'],
                    },
                    colors: {
                        eduCrimson: { 600: '#A51C30', 700: '#8A1525' },
                        eduDark: { 900: '#141414', 800: '#1A1A1A' },
                        eduPaper: '#F7F7F7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-eduPaper text-gray-800 font-sans min-h-screen flex selection:bg-eduCrimson-600 selection:text-white overflow-x-hidden">

    <!-- Sisi Kiri: Logo Besar 100% Transparan TANPA KOTAK PUTIH -->
    <div class="hidden lg:flex lg:w-1/2 bg-eduPaper items-center justify-center p-12 relative z-0">
        <div class="max-w-md w-full flex flex-col items-center justify-center text-center">
            <svg class="w-full max-w-[360px] h-auto drop-shadow-xl" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M250 40C150 40 100 80 100 80V250C100 360 250 460 250 460C250 460 400 360 400 250V80C400 80 350 40 250 40Z" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="6" stroke-linejoin="round"/>
                <path d="M250 65C165 65 120 100 120 100V245C120 340 250 430 250 430C250 430 380 340 380 245V100C380 100 335 65 250 65Z" fill="#F7F7F7"/>
                <path d="M250 110C230 150 210 180 210 200C210 220 225 230 250 230C275 230 290 220 290 200C290 180 270 150 250 110Z" fill="#D97706"/>
                <path d="M225 210H275V245C275 258 263 268 250 268C237 268 225 258 225 245V210Z" fill="#D97706"/>
                <path d="M242 268H258V390C258 395 254 400 250 400C246 400 242 395 242 390V268Z" fill="#D97706"/>
                <path d="M150 220C180 230 220 260 250 310C280 260 320 230 350 220C320 280 270 330 250 370C230 330 180 280 150 220Z" fill="#D97706"/>
                <path d="M135 160C170 180 210 220 250 280C290 220 330 180 365 160C340 230 280 300 250 340C220 300 160 230 135 160Z" fill="#D97706"/>
            </svg>
        </div>
    </div>

    <!-- Sisi Kanan: Panel Form Login -->
    <div class="w-full lg:w-1/2 bg-white min-h-screen flex flex-col justify-between px-6 sm:px-16 lg:px-20 xl:px-28 py-10 relative shadow-2xl z-10">
        
        <div>
            <a href="/" class="inline-flex items-center gap-3 text-xs font-bold uppercase tracking-[0.2em] text-gray-400 hover:text-eduCrimson-600 transition duration-300">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </a>
        </div>
        
        <div class="my-auto py-8">
            <div class="flex lg:hidden items-center gap-3 mb-6">
                <svg class="w-8 h-8 shrink-0" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M250 40C150 40 100 80 100 80V250C100 360 250 460 250 460C250 460 400 360 400 250V80C400 80 350 40 250 40Z" fill="#1E3A8A"/>
                    <path d="M250 65C165 65 120 100 120 100V245C120 340 250 430 250 430C250 430 380 340 380 245V100C380 100 335 65 250 65Z" fill="#FFFFFF"/>
                    <path d="M250 110C230 150 210 180 210 200C210 220 225 230 250 230C275 230 290 220 290 200C290 180 270 150 250 110Z" fill="#D97706"/>
                    <path d="M225 210H275V245C275 258 263 268 250 268C237 268 225 258 225 245V210Z" fill="#D97706"/>
                    <path d="M242 268H258V390C258 395 254 400 250 400C246 400 242 395 242 390V268Z" fill="#D97706"/>
                    <path d="M150 220C180 230 220 260 250 310C280 260 320 230 350 220C320 280 270 330 250 370C230 330 180 280 150 220Z" fill="#D97706"/>
                    <path d="M135 160C170 180 210 220 250 280C290 220 330 180 365 160C340 230 280 300 250 340C220 300 160 230 135 160Z" fill="#D97706"/>
                </svg>
                <span class="text-2xl font-serif font-bold text-eduDark-900">EduLink.</span>
            </div>

            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-serif font-bold text-eduDark-900 mb-4 tracking-tight">
                Portal Login.
            </h1>
            <div class="border-l-[3px] border-eduCrimson-600 pl-4 mb-8">
                <p class="text-gray-500 font-serif italic text-xs sm:text-sm leading-relaxed">
                    Suite terpadu untuk Disiplin, Prestasi, Absensi, dan CBT – administrasi jauh lebih ringan.
                </p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-eduCrimson-600 text-eduCrimson-700 text-xs font-bold uppercase tracking-wider flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-base"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form action="/login" method="POST" class="flex flex-col gap-5">
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">Login Sebagai *</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-tie absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                        <select name="role" required class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-3.5 pl-12 pr-10 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 appearance-none cursor-pointer rounded-none">
                            <option value="">-- Pilih Peran Anda --</option>
                            <option value="admin">Administrator</option>
                            <option value="guru">Guru / Staff</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                    </div>
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">NIP / NISN / Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" name="username" required placeholder="Masukkan ID Anda" autocomplete="off" class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-3.5 pl-12 pr-4 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 rounded-none">
                    </div>
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em]">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="password" name="password" required placeholder="Masukkan Password Anda" class="w-full bg-gray-50/50 border border-gray-200 text-eduDark-900 text-sm py-3.5 pl-12 pr-4 focus:outline-none focus:border-eduCrimson-600 focus:bg-white transition duration-300 rounded-none">
                    </div>
                </div>
                
                <button type="submit" class="mt-2 bg-eduDark-900 hover:bg-eduCrimson-600 text-white font-bold py-4 transition duration-300 flex items-center justify-center gap-3 text-[12px] uppercase tracking-widest shadow-xl w-full group">
                    Masuk ke EduLink <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition duration-300"></i>
                </button>
                
                <p class="text-center text-xs text-gray-400 mt-1 italic font-serif">
                    Pastikan memilih peran yang tepat sebelum masuk.
                </p>
            </form>
        </div>
        
        <div class="border-t border-gray-100 pt-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
            <span class="text-[10px] sm:text-[11px] text-gray-400 uppercase tracking-widest">&copy; 2026 EduLink Platform.</span>
            <a href="#" class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] hover:text-eduCrimson-600 transition">
                Tentang Aplikasi
            </a>
        </div>
        
    </div>

</body>
</html>
