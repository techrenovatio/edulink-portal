<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Harian - SMA Syekh Yusuf</title>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='images/smaunis.webp') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] },
                    colors: { syekhGreen: { 600: '#15803D', 700: '#166534', 800: '#14532D', 900: '#064E3B' }, syekhGold: { 400: '#FACC15', 500: '#EAB308', 600: '#CA8A04' } }
                }
            }
        }
    </script>
    <style>
        @media print {
            aside, header { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .print-hidden { display: none !important; }
            body { background-color: white !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <aside id="sidebar" class="fixed lg:static top-0 left-0 h-full w-64 bg-syekhGreen-900 text-gray-300 flex flex-col shadow-2xl z-40 shrink-0 transform -translate-x-full lg:translate-x-0 transition-transform print-hidden">
        <div class="h-24 flex items-center px-6 border-b border-syekhGreen-800">
            <span class="text-sm font-serif font-bold text-white">SMA SYEKH YUSUF</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-1.5">
            <a href="/dashboard" class="flex items-center gap-4 px-4 py-3 hover:bg-syekhGreen-800 rounded-lg"><i class="fa-solid fa-chart-line w-5"></i><span class="text-xs font-semibold">OVERVIEW</span></a>
            <a href="/users" class="flex items-center gap-4 px-4 py-3 hover:bg-syekhGreen-800 rounded-lg"><i class="fa-solid fa-user-gear w-5"></i><span class="text-xs font-semibold">KELOLA PENGGUNA</span></a>
            <a href="/siswa" class="flex items-center gap-4 px-4 py-3 hover:bg-syekhGreen-800 rounded-lg"><i class="fa-solid fa-users w-5"></i><span class="text-xs font-semibold">DATA SISWA</span></a>
            <a href="/poin" class="flex items-center gap-4 px-4 py-3 hover:bg-syekhGreen-800 rounded-lg"><i class="fa-solid fa-scale-balanced w-5"></i><span class="text-xs font-semibold">POIN PELANGGARAN</span></a>
            <a href="/laporan" class="flex items-center gap-4 px-4 py-3 hover:bg-syekhGreen-800 rounded-lg"><i class="fa-solid fa-file-invoice w-5"></i><span class="text-xs font-semibold">LAPORAN & REKAP</span></a>
            <a href="/presensi" class="flex items-center gap-4 px-4 py-3 bg-syekhGreen-800 text-white border-l-4 border-syekhGold-500 rounded-lg"><i class="fa-solid fa-clipboard-user w-5 text-syekhGold-400"></i><span class="text-xs font-bold">PRESENSI HARIAN</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full relative z-10 min-w-0 print:m-0 print:h-auto overflow-y-auto">
        <header class="h-24 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-8 shrink-0 print-hidden">
            <div><h1 class="text-xl font-serif font-bold text-syekhGreen-900">Presensi Kelas & Akademik</h1></div>
        </header>

        <div class="p-4 sm:p-8 space-y-6">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-4 items-end border-t-4 border-t-syekhGreen-700 print-hidden">
                <div><label class="text-xs font-bold text-gray-500 uppercase">Tanggal</label><input type="date" id="tanggalAbsen" class="w-full bg-gray-50 border py-2 px-3 text-xs rounded"></div>
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Kelas</label>
                    <select id="selectKelasAbsensi" onchange="updateMapelDropdown()" class="w-full bg-gray-50 border py-2 px-3 text-xs rounded">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="X IPA 1">X IPA 1</option><option value="XI IPA 1">XI IPA 1</option><option value="XII IPA 1">XII IPA 1</option>
                    </select>
                </div>
                <div><label class="text-xs font-bold text-gray-500 uppercase">Mata Pelajaran</label><select id="selectMapel" class="w-full bg-gray-50 border py-2 px-3 text-xs rounded"><option value="">-- Pilih Mapel --</option></select></div>
                <div><label class="text-xs font-bold text-gray-500 uppercase">Pertemuan Ke-</label><input type="number" id="inputPertemuan" value="1" class="w-full bg-gray-50 border py-2 px-3 text-xs rounded"></div>
            </div>

            <div class="flex justify-end gap-3 print-hidden">
                <button onclick="window.print()" class="bg-syekhGold-500 hover:bg-syekhGold-600 text-syekhGreen-900 text-[11px] font-bold uppercase tracking-widest px-6 py-3 transition flex items-center gap-2 rounded shadow-md">
                    <i class="fa-solid fa-print"></i> Cetak Presensi
                </button>
                <button onclick="simpanPresensi()" class="bg-syekhGreen-800 text-white text-[11px] font-bold uppercase px-6 py-3 rounded shadow-md"><i class="fa-solid fa-floppy-disk"></i> Simpan Presensi</button>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden print:border-none print:shadow-none w-full">
                <table class="w-full text-left text-xs sm:text-sm text-gray-600">
                    <thead class="bg-gray-100 border-b border-gray-200 uppercase font-bold tracking-wider">
                        <tr>
                            <th class="px-6 py-4">NISN / Nama Siswa</th>
                            <th class="px-4 py-4 text-center">Akumulasi (H/I/S/A)</th>
                            <th class="px-6 py-4 text-right print-hidden">Status Kehadiran Hari Ini</th>
                        </tr>
                    </thead>
                    <tbody id="absensiTableBody">
                        {% for s in siswa_list %}
                        <tr class="border-b border-gray-50 absensi-row hidden" data-kelas="{{ s.kelas }}">
                            <td class="px-6 py-4"><p class="font-bold text-syekhGreen-900">{{ s.nama_siswa }}</p><p class="text-[10px] text-gray-500 nisn-cell">{{ s.nisn }}</p></td>
                            <td class="px-4 py-4 text-center"><span class="text-emerald-700 font-bold bg-emerald-50 px-1.5 rounded">0</span></td>
                            <td class="px-6 py-4 text-right print-hidden"><button class="status-btn bg-emerald-100 text-emerald-800 font-bold px-4 py-1.5 text-[10px] rounded">HADIR</button></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const masterMapel = {{ mapel_master | tojson | safe }};
        const hakKelas = "{{ hak_kelas }}"; const hakMapel = "{{ hak_mapel }}"; const role = "{{ role }}";
        
        document.addEventListener('DOMContentLoaded', () => { document.getElementById('tanggalAbsen').value = new Date().toISOString().split('T')[0]; });

        function updateMapelDropdown() {
            const kelasVal = document.getElementById('selectKelasAbsensi').value;
            const rows = document.querySelectorAll('.absensi-row');
            rows.forEach(row => { row.classList.toggle('hidden', kelasVal !== row.getAttribute('data-kelas')); });
        }
    </script>
</body>
</html>
